# edge node site config
limit_req_zone $binary_remote_addr zone=edge_api:16m rate=20r/s;

upstream edge_api_apse {
    server 198.51.100.21:8443 max_fails=3 fail_timeout=15s;
    server 198.51.100.22:8443 max_fails=3 fail_timeout=15s;
    keepalive 64;
}

upstream edge_api_apne {
    server 203.0.113.41:8443 max_fails=3 fail_timeout=15s;
    server 203.0.113.42:8443 max_fails=3 fail_timeout=15s;
    keepalive 64;
}

server {
    listen 443 ssl http2;
    server_name keetainc.com www.keetainc.com api.keetainc.com;

    ssl_certificate     /etc/nginx/certs/keetainc.com.fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/keetainc.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/keetainc.com.access.log main;
    error_log  /var/log/nginx/keetainc.com.error.log warn;

    client_max_body_size 8m;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout    15s;

    location /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /api/ {
        limit_req zone=edge_api burst=40 nodelay;
        proxy_pass https://edge_api_apse;
    }

    location /api-ne/ {
        limit_req zone=edge_api burst=40 nodelay;
        rewrite ^/api-ne/(.*)$ /api/$1 break;
        proxy_pass https://edge_api_apne;
    }
}
